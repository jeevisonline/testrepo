name: Deploy README to GitHub Pages

on:
  push:
    branches: [ "main" ]  # change if your default branch is different
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build static HTML from README.md
        shell: bash
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install markdown
          mkdir -p _site
          python3 - <<'PY'
import markdown, pathlib, html
readme = pathlib.Path('README.md').read_text(encoding='utf-8')
title = pathlib.Path.cwd().name
body = markdown.markdown(readme)
template = f"""<!doctype html><meta charset="utf-8">
<title>{html.escape(title)}</title>
<link rel="stylesheet" href="https://unpkg.com/github-markdown-css/github-markdown.css">
<article class="markdown-body" style="max-width:860px;margin:40px auto;padding:24px;">
{body}
</article>"""
pathlib.Path('_site/index.html').write_text(template, encoding='utf-8')
PY

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
