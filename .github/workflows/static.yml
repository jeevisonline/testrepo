name: Deploy README to GitHub Pages

on:
  push:
    branches: [ "main" ]  # change if your default branch is different
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build static HTML from README.md (dark theme)
        shell: bash
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install markdown
          mkdir -p _site
          python3 - <<'PY'
          import markdown, pathlib, html
          readme = pathlib.Path('README.md').read_text(encoding='utf-8')
          title = pathlib.Path.cwd().name
          body = markdown.markdown(readme, extensions=['fenced_code', 'tables'])
          css = """
          <style>
            :root{
              --bg:#0d1117; --fg:#c9d1d9; --muted:#8b949e;
              --card:#161b22; --border:#30363d; --link:#58a6ff; --code:#161b22;
            }
            html,body{background:var(--bg); color:var(--fg); margin:0; padding:0;}
            a{color:var(--link);}
            img{max-width:100%;}
            .wrap{max-width: 980px; margin: 48px auto; padding: 0 20px;}
            .markdown-body{
              background: var(--card);
              border: 1px solid var(--border);
              border-radius: 12px;
              padding: 32px;
              line-height: 1.6;
              font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
            }
            .markdown-body h1, .markdown-body h2, .markdown-body h3 { margin-top: 1.2em; }
            .markdown-body code { background: var(--code); padding: .2em .35em; border-radius: 6px; }
            .markdown-body pre { background: var(--code); padding: 14px; border-radius: 10px; overflow:auto; }
            .markdown-body hr { border:0; border-top:1px solid var(--border); }
            .markdown-body table { border-collapse: collapse; }
            .markdown-body table th, .markdown-body table td {
              border: 1px solid var(--border); padding: 6px 10px;
            }
            .markdown-body blockquote {
              margin: 1em 0; padding: .6em 1em; border-left: 4px solid var(--border); color: var(--muted); background: #0f141a;
              border-radius: 4px;
            }
          </style>
          """
          html_doc = f"""<!doctype html>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>{html.escape(title)}</title>
          <div class="wrap">
            <article class="markdown-body">
              {body}
            </article>
          </div>
          {css}
          """
          pathlib.Path('_site/index.html').write_text(html_doc, encoding='utf-8')
          PY


      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
